version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: his-postgres
    restart: always
    environment:
      POSTGRES_USER: Admin  
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: his_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: